name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ESLint, then Prettier's formatting check.
      - run: npm run lint
      - run: npm test
      # Type-checks, then builds.
      - run: npm run build
